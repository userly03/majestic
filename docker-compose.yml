# A single command to run Majestic in a container, pointing at a DataHub
# instance already started with `datahub docker quickstart` (this compose
# file does NOT reimplement DataHub's stack — GMS, Elasticsearch, Kafka,
# MySQL — the datahub CLI already handles that, and duplicating it here
# would be fragile and drift out of sync with every new DataHub version).
#
# Prerequisites:
#   1. datahub docker quickstart          (leaves GMS listening on :8080)
#   2. cp .env.example .env               (and edit it if needed)
#
# Usage:
#   docker compose up                                    # runs scripts/spike_test.py (validates connection)
#   docker compose run --rm majestic python main.py doctor
#   docker compose run --rm majestic python main.py diagnose "<urn>" --explain
#   docker compose run --rm majestic python scripts/seed_demo_data.py

services:
  majestic:
    build: .
    env_file:
      - .env
    # network_mode: host is the simplest way to reach the GMS from
    # `datahub docker quickstart` on localhost:8080 without having to
    # figure out the internal Docker network name that CLI sets up.
    network_mode: host

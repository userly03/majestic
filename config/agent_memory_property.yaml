# Definition of Majestic's episodic memory as DataHub structured properties.
#
# Apply with:
#   datahub properties upsert -f config/agent_memory_property.yaml
# or programmatically (what `python3 main.py doctor` uses):
#   StructuredProperties.create("config/agent_memory_property.yaml", client.graph)
#
# IMPORTANT: the field names are the ones expected by the pydantic model
# `datahub.api.entities.structuredproperties.structuredproperties.StructuredProperties`
# from acryl-datahub==1.7.0 — CONFIRMED by direct introspection of the
# installed SDK, not from documentation. They're snake_case
# (`display_name`, `entity_types`), not camelCase — a first attempt with
# `displayName`/`entityTypes` fails with "Extra inputs are not permitted"
# because the pydantic model has `extra="forbid"`. If you upgrade the SDK
# version, run `python3 main.py doctor` first: if this breaks, it will
# fail there with a clear error, not silently.

- id: majestic.patternSignature
  type: string
  cardinality: SINGLE
  display_name: "Majestic - Pattern Signature"
  description: >
    Deterministic failure-pattern signature, formatted as
    "anomaly_type:depth:upstream:downstream:platform". Lets Majestic
    recognize the same causal structure on another entity and reuse the
    diagnosis instead of reasoning from scratch.
  entity_types:
    - dataset

- id: majestic.diagnosis
  type: string
  cardinality: SINGLE
  display_name: "Majestic - Diagnosis"
  description: >
    Root-cause diagnosis generated by the agent, with the causal chain
    (up to 3 links) and the concrete graph evidence backing each link.
  entity_types:
    - dataset

- id: majestic.businessContext
  type: string
  cardinality: SINGLE
  display_name: "Majestic - Business Context"
  description: >
    Free text, editable by a human when closing the incident: a lesson
    learned or business context the agent can't infer from the graph
    on its own.
  entity_types:
    - dataset

- id: majestic.confidenceScore
  type: number
  cardinality: SINGLE
  display_name: "Majestic - Confidence Score"
  description: >
    Confidence (0.0 to 1.0) of the diagnosis, based on how much concrete
    evidence backs the causal chain.
  entity_types:
    - dataset

- id: majestic.diagnosedAt
  type: string
  cardinality: SINGLE
  display_name: "Majestic - Diagnosed At"
  description: >
    ISO 8601 timestamp of when this diagnosis was generated (or reused).
  entity_types:
    - dataset

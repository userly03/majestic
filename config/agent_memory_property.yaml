# Definición de la memoria episódica de Majestic como structured properties de DataHub.
#
# Aplicar con:
#   datahub properties upsert -f config/agent_memory_property.yaml
# o programáticamente (lo que usa `python3 main.py doctor`):
#   StructuredProperties.create("config/agent_memory_property.yaml", client.graph)
#
# IMPORTANTE: los nombres de campo son los que espera el modelo pydantic
# `datahub.api.entities.structuredproperties.structuredproperties.StructuredProperties`
# de acryl-datahub==1.7.0 — CONFIRMADOS por introspección directa del SDK
# instalado, no por la documentación. Son snake_case (`display_name`,
# `entity_types`), no camelCase — un primer intento con `displayName`/
# `entityTypes` falla con "Extra inputs are not permitted" porque el
# modelo pydantic tiene `extra="forbid"`. Si actualizás la versión del
# SDK, correr `python3 main.py doctor` primero: si esto rompe, va a
# fallar ahí con un error claro, no en silencio.

- id: majestic.patternSignature
  type: string
  cardinality: SINGLE
  display_name: "Majestic - Firma de patrón"
  description: >
    Firma determinista del patrón de fallo, con formato
    "tipo_anomalia:profundidad:upstream:downstream". Permite a Majestic
    reconocer la misma estructura causal en otra entidad y reutilizar
    el diagnóstico en vez de razonar desde cero.
  entity_types:
    - dataset

- id: majestic.diagnosis
  type: string
  cardinality: SINGLE
  display_name: "Majestic - Diagnóstico"
  description: >
    Diagnóstico de causa raíz generado por el agente, con la cadena
    causal (máximo 3 eslabones) y la evidencia concreta del grafo que
    respalda cada eslabón.
  entity_types:
    - dataset

- id: majestic.businessContext
  type: string
  cardinality: SINGLE
  display_name: "Majestic - Contexto de negocio"
  description: >
    Texto libre editable por un humano al cerrar el incidente: lección
    aprendida o contexto de negocio que el agente no puede inferir del
    grafo por sí solo.
  entity_types:
    - dataset

- id: majestic.confidenceScore
  type: number
  cardinality: SINGLE
  display_name: "Majestic - Score de confianza"
  description: >
    Confianza (0.0 a 1.0) del diagnóstico, en función de cuánta
    evidencia concreta respalda la cadena causal.
  entity_types:
    - dataset

- id: majestic.diagnosedAt
  type: string
  cardinality: SINGLE
  display_name: "Majestic - Diagnosticado en"
  description: >
    Timestamp ISO 8601 de cuándo se generó (o reutilizó) este diagnóstico.
  entity_types:
    - dataset
